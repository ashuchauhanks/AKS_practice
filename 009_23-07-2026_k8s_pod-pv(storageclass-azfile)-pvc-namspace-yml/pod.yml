apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod1
  namespace: dev-ns

spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: azure-storage
      mountPath: /usr/share/nginx/html
    - name: azure-storage2
      mountPath: /usr/share/nginx/

  volumes:
  - name: azure-storage
    persistentVolumeClaim:
      claimName: azurefile-pvc1
  - name: azure-storage2
    persistentVolumeClaim:
      claimName: azurefile-pvc2


---

apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod2
  namespace: dev-ns

spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: azure-storage
      mountPath: /usr/share/nginx/html

  volumes:
  - name: azure-storage
    persistentVolumeClaim:
      claimName: azurefile-pvc1