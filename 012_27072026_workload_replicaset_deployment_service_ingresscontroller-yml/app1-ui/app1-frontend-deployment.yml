apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-ui-deploy
  namespace: flipkart-dev
  labels: 
    app: app1-ui
    component: frontend
    environment: dev

spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app1-ui-pod-dev
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
    type: RollingUpdate

  template:
    metadata: 
      labels:
        app: app1-ui-pod-dev
        
    spec:
      containers:
      - name: app1-ui-container
        image: jlesage/firefox
        ports:
        - containerPort: 5800
          protocol: TCP
        # resources:
        #   requests:            #requests = Minimum guaranteed resources (Scheduling ke liye use hota hai)
        #     cpu: 0m
        #     memory: 0Mi
        #   limits:             #limits = Maximum resources container use kar sakta hai
        #     cpu: 500m
        #     memory: 512Mi
            





