apiVersion: v1
kind: PersistentVolume
metadata:
  name: azure-disk-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: disk.csi.azure.com
    volumeHandle: "/subscriptions/0ae5ab6b-cbab-4b15-82a7-6ef0998daef7/resourceGroups/ashu-rgforaks/providers/Microsoft.Compute/disks/azdiskashu"
    fsType: ext4


